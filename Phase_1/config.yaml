# hyperparams for yolo26

# training
data: "/app/data"
epochs: 50
imgsz: 640
device: 0
project: "/app/runs"
name: "yolo26_speed_limit"

#lr and optimisers to be implemented

# augmentations
# see https://docs.ultralytics.com/guides/yolo-data-augmentation
hsv_h: 0.1
hsv_s: 0.5
hsv_v: 0.5
degrees: 30
translate: 0.1
scale: 0.1
shear: 5
perspective: 0.0005
flipud: 0
fliplr: 0
bgr: 0.5
mosaic: 0
mixup: 0
cutmix: 0
copy_paste: 0
erasing: 0.25