# tuning --> if true, will use raytune to do hyperparam tuning
# see https://docs.ultralytics.com/integrations/ray-tune
tuner: True
use_ray: True
data: "/app/data"
epochs: 50
name: "yolo26_speed_limit_tune"
seed: 0
space:
  lr0:
    type: uniform
    min: 0.00001
    max: 0.1
  lrf:
    type: uniform
    min: 0.01
    max: 0.5
  batch:
    type: choice
    values: [4, 8, 16, 32]
  imgsz:
    type: choice
    values: [320, 416, 512, 640]
  momentum:
    type: uniform
    min: 0.8
    max: 0.99
  weight_decay:
    type: uniform
    min: 0.0001
    max: 0.1
  cls:
    type: uniform
    min: 0.5
    max: 2.0
grace_period: 10
gpu_per_trial: 1
iterations: 200
search_alg: "optuna"
wandb:
  project: adversarial-cv-speed-limit-sign
  entity: hongyaok-hongyaok
