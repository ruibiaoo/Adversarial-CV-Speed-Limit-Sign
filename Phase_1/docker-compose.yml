services:
  phase1-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: speed-limit-classifier:phase1
    container_name: phase1_yolo26_train
    environment:
      PYTHONUNBUFFERED: "1"
      CUDA_VISIBLE_DEVICES: "0"
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      WANDB_ENTITY: hongyaok-hongyaok
    volumes:
      # Mount dataset directory from repo root as read-only
      - ../data/data_processed:/app/data:ro
      # Mount runtime sources and output only, excluding the local .env secret.
      - ./train.py:/app/train.py
      - ./tuning_config.py:/app/tuning_config.py
      - ./wandb_config.py:/app/wandb_config.py
      - ./config.yaml:/app/config.yaml
      - ./tuner.yaml:/app/tuner.yaml
      - ./run.sh:/app/run.sh
      - ./runs:/app/runs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    # Allocate shared memory for PyTorch DataLoader workers to avoid bus errors
    shm_size: '8gb'
    ipc: host
    command: bash run.sh
