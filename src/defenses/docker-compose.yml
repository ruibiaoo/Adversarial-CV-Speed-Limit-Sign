services:
  phase3:
    build:
      context: ..
      dockerfile: defenses/Dockerfile
    image: speed-limit-classifier:phase3-tf
    volumes:
      - ../..:/repo       # whole repo: data/, src/modelling (code + base model), src/defenses
    working_dir: /repo/src/defenses
    environment:
      # Keep the CUDA PTX JIT cache between runs. TF has no native kernels
      # for newer GPUs (e.g. RTX 50xx), so the first run compiles everything.
      CUDA_CACHE_PATH: /repo/src/defenses/.cuda_cache
      CUDA_CACHE_MAXSIZE: "4294967296"
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
