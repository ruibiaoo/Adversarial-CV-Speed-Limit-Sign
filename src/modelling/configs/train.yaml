# hyperparams for tf resnet
# training
data: "/app/data"
epochs: 300
save_latest_best: true
early_stopping_patience: 20
reduce_lr_patience: 4
reduce_lr_factor: 0.2
min_learning_rate: 0.000005
batch: 16
workers: 0 # Load data in the training process to reduce RAM usage.
image_size: 256
device: 0
project: "/app/runs"
name: "tf_resnet50_robust_v2"

# model, change this to try other backbones
model_name: resnet50 # resnet50, resnet101
pretrained: /app/runs/best_baseline.keras # true (imagenet), false (random init), or path to checkpoint (e.g. "/app/runs/best.keras")
freeze_backbone: false # if true, only train the last layer first
dropout: 0.4

# robust training (Equation 3 in arXiv:1906.00945v2, page 4)
robust: true # toggle true to use RobustModel (PGD adversarial training)
robust_norm: l2 # l2 (paper default) or linf
robust_eps: 3.0 # perturbation budget eps in [0, 1] space (e.g. 3.0 for l2, 0.03137 or 8 for linf)
robust_step_size: 0.5 # PGD step size in [0, 1] space (e.g. 0.5 for l2, 0.00784 or 2 for linf)
robust_steps: 7 # PGD iterations (Table 3 in paper uses 7)
robust_random_start: true # random init inside the eps-ball before PGD steps

# optimizer
optimizer: adam # sgd, adam, adamw
learning_rate: 0.0003
momentum: 0.9 # only used for sgd
weight_decay: 0.0005 # only used for adamw, and as l2 on last layer
seed: 4266
class_weight: balanced # balanced or none, helps when classes are uneven

wandb: # dont change
  project: adversarial-cv-speed-limit-sign
  entity: hongyaok-hongyaok

# augmentations, same values as old yolo config
# see https://docs.ultralytics.com/guides/yolo-data-augmentation
# these are applied on the fly, only on train split
# augment false = train gets resize + preprocess only, same as val
augment: true
hsv_h: 0.02
hsv_s: 0.1
hsv_v: 0.1
degrees: 30
translate: 0.1
scale: 0.1
shear: 5
perspective: 0.0005
flipud: 0
fliplr: 0
bgr: 0
grayscale: 0.2
mosaic: 0
mixup: 0
cutmix: 0
copy_paste: 0
erasing: 0
blur_p: 0.2 # probability of blur (0.0 to 1.0; 0 to disable)
blur_limit: [3,7] # blur strength / max kernel size (odd integer >= 3, e.g. 3, 5, 7, 9)