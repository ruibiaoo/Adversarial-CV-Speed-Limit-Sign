# Model and test data
model_path: "/app/runs/grl_adversarial_retraining/best.keras"
data: "/app/eval_data"
split: "test"
image_size: 256 # must be same as model thats was trained
batch: 16

# ConvAE preprocessing (optional purifier placed in front of the ResNet classifier)
convae:
  enabled: false
  model_path: "/app/runs/convae/convae_adv2clean_aug_v6/best.keras"

# Keep this order the same as training
class_names:
  - 10_MPH
  - 20_MPH
  - 30_MPH
  - 40_MPH
  - 50_MPH
  - 60_MPH
  - 70_MPH

# Test reports are saved here
output_dir: "/app/results/grl_adversarial_retraining/test"
